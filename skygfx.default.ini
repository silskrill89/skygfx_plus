; =============================================================================
; skygfx.default.ini - canonical default configuration (reference only)
; =============================================================================
; NOT auto-loaded. SkyGFX reads skygfx.ini (or skygfx1.ini .. skygfx9.ini)
; next to skygfx.asi. This file documents every live key that has a concrete
; default, plus the value the code uses when the key is absent. Copy it to
; skygfx.ini for a clean default install.
;
; Value sources, in this order:
;   1. the brand-new-INI writer in src/core/main.cpp readIniFile()
;   2. the ADD_IF_MISSING block for existing INIs
;   3. the read-site default expression (preset-dependent fields are resolved
;      with the default pipeline=PBR and qualityPreset=3/ULTRA)
;
; "; mode-owned: <aliases>" lists the [Modes] profiles whose table in
; src/core/modeManager.cpp writes that field on engage. The profile wins over
; the top-level value while the mode is active; the top-level value is the
; per-slot base that comes back on disengage.
;
; Deliberately absent (not live keys):
;   buildingPipe, vehiclePipe  - absent means "no explicit override" (-1);
;                                any value would pin a pipe instead.
;   stochasticTexturing,
;   stochastic                 - deprecated aliases of noiseDetail.
;   ps2grassFiles              - read site is commented out (dead key).
;   waterReflectionFarClip     - removed, zero consumers (W7-C).
; =============================================================================

[General]
; Global settings (not per-config-slot).
NoiseQuality = 0                        ; 0=32, 1=128, 2=512, >=3=1024

