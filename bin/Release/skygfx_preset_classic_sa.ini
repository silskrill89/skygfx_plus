[SkyGfx]
; ============================================================
; SkyGFX Plus - Classic San Andreas Preset
; ============================================================
; Features: Faithful PS2 look with PC compatibility fixes
; ============================================================

presetMode=1
presetName=Classic_SA

; ===== Core Pipeline (PS2 style) =====
buildingPipe=PS2
vehiclePipe=PS2
colorFilter=PS2
radiosity=PS2
doRadiosity=1

; ===== No GTA IV mode =====
ivMode=0

; ===== PS2 Color Correction =====
ps2ModulateBuilding=1
ps2ModulateVehicle=1
ps2ModulateGrass=1
dualPassBuilding=0
dualPassVehicle=0
dualPassGrass=0
dualPassDefault=0
dualPassPed=0

; ===== Vehicle Rendering (PS2) =====
envMapSize=128
envMapUseLODs=0
envMapFarClipMult=1.0
neoShininessMult=1.0
neoSpecularityMult=1.0
envShininessMult=1.0
envSpecularityMult=1.0
envPower=20.0
envFresnel=0.7

; ===== Vegetation =====
grassAddAmbient=0
grassBackfaceCull=1
grassFixPlacement=0
detailMaps=0
stochasticTexturing=0

; ===== Shadows =====
pedShadows=-1
stencilShadows=-1

; ===== No Modern Enhancements =====
smaaEnable=0
ssaoEnable=0
motionBlurEnable=0
sssPostProcessEnable=0
skinEnhanceEnable=0
hairEnhanceEnable=0
vegetationEnhanceEnable=0
edgeTessEnable=0

; ===== Color Correction =====
rgb1Mult=1.0
rgb2Mult=1.0

; ===== Misc =====
lightningIlluminatesWorld=0
coronaZtest=-1
sunGlare=0
neoWaterDrops=0
neoBloodDrops=0
YCbCrCorrection=0
