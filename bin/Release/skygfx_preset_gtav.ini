[SkyGfx]
; ============================================================
; SkyGFX Plus - GTA V Style Preset
; ============================================================
; Features: Warm tones, soft reflections, modern AA/SSAO
; ============================================================

presetMode=1
presetName=GTA5_Style

; ===== Core Pipeline =====
buildingPipe=GTAIV
vehiclePipe=Neo
colorFilter=VCS
radiosity=Shader
doRadiosity=1

; ===== GTA IV Tonemapping (softer) =====
ivMode=1
ivDesaturation=0.15
ivGamma=1.05
ivVignetteIntensity=0.3
ivVignetteRadius=0.7
ivVignetteContrast=2.0
ivBloomIntensity=0.18
ivExposure=1.1

; ===== PS2 Color Correction =====
ps2ModulateBuilding=0
ps2ModulateVehicle=0
ps2ModulateGrass=0
dualPassBuilding=1
dualPassVehicle=1
dualPassGrass=1
dualPassDefault=1
dualPassPed=1

; ===== Vehicle Rendering =====
envMapSize=512
envMapUseLODs=1
envMapFarClipMult=1.2
neoShininessMult=1.0
neoSpecularityMult=1.0
envShininessMult=1.0
envSpecularityMult=1.0
envPower=24.0
envFresnel=0.85

; ===== Vegetation =====
grassAddAmbient=1
grassBackfaceCull=1
grassFixPlacement=1
detailMaps=1
stochasticTexturing=1

; ===== Shadows =====
pedShadows=1
stencilShadows=1

; ===== Modern Enhancements =====
smaaEnable=1
smaaPreset=3
smaaPredication=0
smaaTemporal=0

ssaoEnable=1
ssaoRadius=1.2
ssaoPower=1.8
ssaoKernelSize=16
ssaoSampleCount=16

motionBlurEnable=1
motionBlurStrength=0.35
motionBlurRadial=0.15
motionBlurSpeedFactor=0.25
motionBlurCameraAware=1

sssPostProcessEnable=0
skinEnhanceEnable=0
hairEnhanceEnable=0
vegetationEnhanceEnable=0
edgeTessEnable=0

; ===== Color Correction =====
rgb1Mult=0.90
rgb2Mult=0.95

; ===== Misc =====
lightningIlluminatesWorld=1
coronaZtest=1
sunGlare=1
neoWaterDrops=1
neoBloodDrops=0
YCbCrCorrection=0
