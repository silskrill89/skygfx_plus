[SkyGfx]
; ============================================================
; SkyGFX Plus - GTA IV Modern Mode Preset
; ============================================================
; Features: Filmic tonemapping, PBR vehicle shader, metalness
; All modern enhancements enabled for maximum quality
; ============================================================

; ===== Preset Selection =====
; Set to 0 to use custom settings from skygfx.ini
; Set to 1 to load this preset (overrides other settings)
presetMode=1
presetName=GTAIV_Modern

; ===== Core Pipeline (GTA IV style) =====
buildingPipe=GTAIV
vehiclePipe=GTAIV
colorFilter=GTAIV
radiosity=Shader
doRadiosity=0

; ===== GTA IV Filmic Tonemapping =====
ivMode=1
ivDesaturation=0.25
ivGamma=1.1
ivVignetteIntensity=0.4
ivVignetteRadius=0.6
ivVignetteContrast=2.5
ivBloomIntensity=0.12
ivExposure=1.2

; ===== PS2 Color Correction (PC gamma 2.2) =====
ps2ModulateBuilding=0
ps2ModulateVehicle=0
ps2ModulateGrass=0
dualPassBuilding=1
dualPassVehicle=1
dualPassGrass=1
dualPassDefault=1
dualPassPed=1

; ===== Vehicle Rendering (PBR Modern) =====
envMapSize=512
envMapUseLODs=1
envMapFarClipMult=1.5
neoShininessMult=1.2
neoSpecularityMult=1.0
envShininessMult=1.5
envSpecularityMult=1.2
envPower=32.0
envFresnel=0.97

; ===== Vegetation =====
grassAddAmbient=1
grassBackfaceCull=1
grassFixPlacement=1

; ===== Building Rendering =====
detailMaps=1
stochasticTexturing=1

; ===== Shadows =====
pedShadows=1
stencilShadows=1

; ===== Modern Enhancements (ALL ENABLED) =====

; --- SMAA Anti-Aliasing ---
smaaEnable=1
smaaPreset=3
smaaPredication=0
smaaTemporal=0

; --- SSAO ---
ssaoEnable=1
ssaoRadius=1.0
ssaoPower=2.0
ssaoKernelSize=16
ssaoSampleCount=16

; --- Motion Blur ---
motionBlurEnable=1
motionBlurStrength=0.4
motionBlurRadial=0.2
motionBlurSpeedFactor=0.3
motionBlurCameraAware=1

; --- SSS Post-Process ---
sssPostProcessEnable=1
sssPostProcessStrength=0.2
sssPostProcessRadius=3.0
sssPostProcessThreshold=0.15

; --- Skin Enhancement ---
skinEnhanceEnable=1
skinWrapFactor=0.4
skinSpecularPower=24.0
skinSpecularStrength=0.2
skinSSSStrength=0.3

; --- Hair Enhancement ---
hairEnhanceEnable=1
hairAnisotropicPower=48.0
hairAnisotropicStrength=0.4
hairSSSStrength=0.15

; --- Vegetation Enhancement ---
vegetationEnhanceEnable=1
vegetationSSSStrength=0.2
vegetationAmbientBoost=1.3

; --- Edge Tessellation ---
edgeTessEnable=0
edgeTessStrength=0.005
edgeTessThreshold=0.15

; ===== Color Correction =====
rgb1Mult=0.85
rgb2Mult=0.90

; ===== Misc =====
lightningIlluminatesWorld=1
coronaZtest=1
sunGlare=1
neoWaterDrops=1
neoBloodDrops=0
YCbCrCorrection=0
