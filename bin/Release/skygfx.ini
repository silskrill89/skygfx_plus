[SkyGfx]
; ============================================================
; SkyGFX Plus - Enhanced GTA San Andreas Graphics
; ============================================================
; Features organized by which GTA game first introduced them
; New features are OFF by default - enable one at a time to test
; ============================================================

; ===== GTA III Features =====
; First game in the series with these rendering techniques
; buildingPipe = PS2 | Xbox | GTAIV
; colorFilter = None | PS2 | PC | Mobile | III | VC | VCS | GTAIV
; buildingPipe=PS2
; colorFilter=III

; ===== GTA Vice City Features =====
; Added radiosity light bounce effect
; radiosity = PS2 | Shader
; radiosity=Shader
; doRadiosity=1

; ===== GTA San Andreas Features =====
; Core rendering pipeline settings
; vehiclePipe = PS2 | PC | Xbox | Spec | Mobile | Neo | LCS | VCS | Env | GTAIV
buildingPipe=PC
vehiclePipe=Neo
colorFilter=VCS
ps2ModulateBuilding=0
ps2ModulateVehicle=0
ps2ModulateGrass=0
dualPassBuilding=1
dualPassVehicle=1
dualPassGrass=1
dualPassDefault=1
dualPassPed=1
grassAddAmbient=1
grassBackfaceCull=1
detailMaps=1
stochasticTexturing=1
envMapSize=256
envMapUseLODs=1
envMapFarClipMult=1.0
neoShininessMult=1.0
neoSpecularityMult=1.0
envShininessMult=1.0
envSpecularityMult=1.0
envPower=20.0
envFresnel=0.7
sunGlare=0
neoWaterDrops=0
neoBloodDrops=0
pedShadows=-1
stencilShadows=-1
lightningIlluminatesWorld=0
zwriteThreshold=128
zwriteThresholdGrass=128
zwriteThresholdPed=128
coronaZtest=-1
grassFixPlacement=0
fixPcCarLight=0

; Radiosity settings
radiosity=Shader
doRadiosity=1
radiosityFilterPasses=2
radiosityRenderPasses=1
radiosityIntensity=35
blurLeft=4000
blurTop=4000
blurRight=4000
blurBottom=4000

; VCS Trails (alternative to radiosity)
vcsTrails=0
trailsLimit=80
trailsIntensity=38
trailsResolution=1

; Color filter multipliers
rgb1Mult=1.0
rgb2Mult=1.0

; YCbCr color correction
YCbCrCorrection=0
lumaScale=0.859
lumaOffset=0.063
CbScale=1.23
CbOffset=0.0
CrScale=1.23
CrOffset=0.0

; Night/Infrared vision
nightVision=PS2
infraredVision=PS2
grainFilter=PC

; Timecycle
usePCTimecyc=0

; ===== GTA Liberty City Stories / Vice City Stories =====
; VCS introduced enhanced trails and color grading

; ===== GTA IV Features =====
; Filmic tonemapping and post-processing
ivMode=0
ivDesaturation=0.3
ivGamma=1.0
ivVignetteIntensity=0.5
ivVignetteRadius=0.5
ivVignetteContrast=2.0
ivBloomIntensity=0.15
ivExposure=1.0

; ===== Modern Enhancements =====
; All new features - DISABLED by default
; Enable one at a time to test for compatibility

; --- Anti-Aliasing (SMAA) ---
; Subpixel Morphological Anti-Aliasing
; Presets: 0=LOW, 1=MEDIUM, 2=HIGH, 3=ULTRA
; Uses 3-pass rendering: edge detection, blend weights, neighborhood blending
smaaEnable=1
smaaPreset=3
smaaPredication=0
smaaTemporal=0

; --- Ambient Occlusion (SSAO) ---
; Screen-space ambient occlusion using depth buffer
ssaoEnable=1
ssaoRadius=0.8
ssaoPower=1.5
ssaoKernelSize=16
ssaoSampleCount=16

; --- Motion Blur (Burnout Paradise style) ---
; Speed-based radial + directional motion blur
; Uses camera velocity and frame-to-frame motion detection
motionBlurEnable=0
motionBlurStrength=0.5
motionBlurRadial=0.3
motionBlurSpeedFactor=0.5
motionBlurCameraAware=1

; --- Subsurface Scattering (SSS) Post-Process ---
; Post-process blur for skin translucency effect
; NOTE: Screen-space effect, blurs entire scene with edge preservation
; Does NOT conflict with per-material SSS fields (sssIntensity, etc.)
sssPostProcessEnable=0
sssPostProcessStrength=0.3
sssPostProcessRadius=4.0
sssPostProcessThreshold=0.1

; --- Skin Enhancement ---
; Works ON TOP of existing Rpskin rendering
; Adds wrap lighting for SSS approximation + improved specular
skinEnhanceEnable=0
skinWrapFactor=0.5
skinSpecularPower=16.0
skinSpecularStrength=0.3
skinSSSStrength=0.4

; --- Hair Enhancement ---
; Works ON TOP of existing hair rendering
; Adds anisotropic highlights (Kajiya-Kay) + SSS
hairEnhanceEnable=0
hairAnisotropicPower=32.0
hairAnisotropicStrength=0.5
hairSSSStrength=0.2

; --- Vegetation Enhancement ---
; Works ON TOP of existing grass rendering
; Adds SSS-like translucency + improved ambient
vegetationEnhanceEnable=0
vegetationSSSStrength=0.3
vegetationAmbientBoost=1.2

; --- Edge Tessellation ---
; Displaces vertices along normals at edges
; Requires SMAA edge buffer (smaaEnable=1)
edgeTessEnable=0
edgeTessStrength=0.01
edgeTessThreshold=0.1

; ===== Advanced / Debug =====
; These are for fine-tuning, usually don't need to change
ps2ModulateGlobal=0
dualPassGlobal=0
explicitBuildingPipe=-1
privateHooks=0
forceWindShader=0
normalMapIntensity=1.0
normalMapPlayerOnly=1
