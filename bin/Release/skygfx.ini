[SkyGfx]
; ============================================================
; SkyGFX Plus - MAXED OUT CONFIG
; skygfxplusultramaxdeluxe — every feature enabled at max quality
; ============================================================

qualityPreset=3

; ===== Core Pipeline =====
buildingPipe=Xbox
vehiclePipe=Modern
colorFilter=VCS
radiosity=Shader
doRadiosity=1

; ===== GTA IV Filmic Tonemapping =====
ivMode=0
ivDesaturation=1.0
ivGamma=1.0
ivSaturation=0.2
ivCurves=1.0
ivVignetteIntensity=0.20
ivVignetteRadius=0.75
ivVignetteContrast=1.8
ivBloomIntensity=0.08
ivExposure=1.3

; ===== PS2 Modulation =====
ps2ModulateBuilding=0
ps2ModulateGrass=0
dualPassBuilding=1
dualPassVehicle=1
dualPassGrass=1
dualPassDefault=1
dualPassPed=1

; ===== Vegetation =====
grassAddAmbient=1
grassBackfaceCull=1
grassFixPlacement=1
detailMaps=1
stochasticTexturing=1

; ===== Shadows =====
pedShadows=1
stencilShadows=1

; ===== Misc =====
sunGlare=1
neoWaterDrops=1
neoBloodDrops=1
lightningIlluminatesWorld=1
coronaZtest=1
YCbCrCorrection=1
usePCTimecyc=0
privateHooks=1

; ===== Vehicle Env Map =====
envMapSize=512
envMapUseLODs=1
envMapFarClipMult=2.0
neoShininessMult=2.0
neoSpecularityMult=1.5
envShininessMult=1.0
envSpecularityMult=1.0
envPower=128.0
envFresnel=0.95

; ===== Color Multipliers =====
rgb1Mult=0.90
rgb2Mult=0.95

; ===== SMAA Anti-Aliasing =====
smaaEnable=1
smaaPreset=3
smaaPredication=1
smaaTemporal=1

; ===== SSAO =====
ssaoEnable=1
ssaoRadius=1.2
ssaoPower=2.5
ssaoKernelSize=32
ssaoSampleCount=32

; ===== Motion Blur =====
motionBlurEnable=1
motionBlurStrength=0.5
motionBlurRadial=0.3
motionBlurSpeedFactor=0.4
motionBlurCameraAware=1

; ===== SSS Post-Process =====
sssPostProcessEnable=1
sssPostProcessStrength=0.25
sssPostProcessRadius=4.0
sssPostProcessThreshold=0.12

; ===== Skin Enhancement =====
skinEnhanceEnable=1
skinWrapFactor=0.5
skinSpecularPower=32.0
skinSpecularStrength=0.25
skinSSSStrength=0.35

; ===== Hair Enhancement =====
hairEnhanceEnable=1
hairAnisotropicPower=64.0
hairAnisotropicStrength=0.5
hairSSSStrength=0.2

; ===== Vegetation Enhancement =====
vegetationEnhanceEnable=1
vegetationSSSStrength=0.3
vegetationAmbientBoost=1.5

; ===== Edge Tessellation =====
edgeTessEnable=0
edgeTessStrength=0.000
edgeTessThreshold=0.00

; ===== Normal Buffer =====
normalBufferEnable=1
normalBufferOffset=0.05
normalBufferScale=1.0

; ===== Pipe Chain (post-processing) =====
pipeChainEnable=1
pipeChainIntensity=1.0

; ===== Unified Weather System =====
weatherCycleEnabled=1
timecycleOverrideEnabled=1
unifiedSatBoost=0.15
unifiedIblTintStrength=0.8
unifiedSsaoNoiseScale=1.0
unifiedVertexAOBoost=1.2
unifiedDayReduction=0.8
unifiedPointLightOverride=1.0

; ===== Cloud System =====
cloudOverallStrength=1.0
cloudOverallColor=1.0
cloudEdgeStrength=1.0
cloudFadeout=0.3
cloudHDR=1.2
cloudDitherStrength=0.5
cloudShadowStrength=0.8
cloudBaseStrength=0.6
cloudDensityMult=1.0
cloudDensityBias=0.5
smallCloudDetailStrength=0.3
smallCloudDetailScale=2.0
smallCloudDensityMult=1.0
smallCloudDensityBias=0.5

; ===== IBL =====
unifiedVertexAOBoost=1.2
unifiedDayReduction=0.8
unifiedPointLightOverride=1.0
