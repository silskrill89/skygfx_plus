[SkyGfx]
; ============================================================
; SkyGFX Plus - Full Feature Config
; qualityPreset: 0=LOW, 1=MEDIUM, 2=HIGH, 3=ULTRA
; LOW = PS2 classic, MEDIUM = PC classic, HIGH = Enhanced, ULTRA = Full PBR
; ============================================================

qualityPreset=3

; ===== Core Pipeline =====
buildingPipe=PC
vehiclePipe=Modern
colorFilter=GTAIV
radiosity=Shader
doRadiosity=1

; ===== GTA IV Filmic Tonemapping =====
ivMode=0
ivDesaturation=1.0
ivGamma=1.0
ivSaturation=0.15
ivCurves=1.0
ivVignetteIntensity=0.15
ivVignetteRadius=0.70
ivVignetteContrast=1.5
ivBloomIntensity=0.05
ivExposure=1.2

; ===== GTA San Andreas - PS2 Modulation =====
ps2ModulateBuilding=0
ps2ModulateGrass=0
dualPassBuilding=1
dualPassVehicle=1
dualPassGrass=1
dualPassDefault=1
dualPassPed=1

; ===== GTA San Andreas - Vegetation =====
grassAddAmbient=1
grassBackfaceCull=1
grassFixPlacement=1
detailMaps=1
stochasticTexturing=1

; ===== GTA San Andreas - Shadows =====
pedShadows=1
stencilShadows=1

; ===== GTA San Andreas - Misc =====
sunGlare=1
neoWaterDrops=1
neoBloodDrops=0
lightningIlluminatesWorld=1
coronaZtest=1
YCbCrCorrection=0
usePCTimecyc=0

; ===== Vehicle Env Map =====
envMapSize=512
envMapUseLODs=1
envMapFarClipMult=2.0
neoShininessMult=2.0
neoSpecularityMult=1.5
envShininessMult=1.0
envSpecularityMult=1.0
envPower=128.0
envFresnel=0.95

; ===== Color Multipliers =====
rgb1Mult=0.88
rgb2Mult=0.92

; ===== SMAA Anti-Aliasing =====
smaaEnable=1
smaaPreset=3
smaaPredication=0
smaaTemporal=0

; ===== SSAO =====
ssaoEnable=1
ssaoRadius=1.0
ssaoPower=2.0
ssaoKernelSize=16
ssaoSampleCount=16

; ===== Motion Blur =====
motionBlurEnable=1
motionBlurStrength=0.4
motionBlurRadial=0.2
motionBlurSpeedFactor=0.3
motionBlurCameraAware=1

; ===== SSS Post-Process =====
sssPostProcessEnable=1
sssPostProcessStrength=0.2
sssPostProcessRadius=3.0
sssPostProcessThreshold=0.15

; ===== Skin Enhancement =====
skinEnhanceEnable=1
skinWrapFactor=0.4
skinSpecularPower=24.0
skinSpecularStrength=0.2
skinSSSStrength=0.3

; ===== Hair Enhancement =====
hairEnhanceEnable=1
hairAnisotropicPower=48.0
hairAnisotropicStrength=0.4
hairSSSStrength=0.15

; ===== Vegetation Enhancement =====
vegetationEnhanceEnable=1
vegetationSSSStrength=0.2
vegetationAmbientBoost=1.3

; ===== Edge Tessellation =====
edgeTessEnable=0
edgeTessStrength=0.005
edgeTessThreshold=0.15
