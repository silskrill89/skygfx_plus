[SkyGfx]
; ============================================================
; SkyGFX Plus - GTA IV Enhanced Mode
; ============================================================
; This config enables GTA IV-style rendering with modern enhancements
; All PS2/Xbox code has been translated to PC gamma 2.2 space
; ============================================================

; ===== Core Pipeline (GTA IV style) =====
buildingPipe=GTAIV
vehiclePipe=GTAIV
colorFilter=GTAIV
radiosity=Shader
doRadiosity=0

; ===== GTA IV Filmic Tonemapping =====
; Uses Uncharted2/Hable filmic curve from RAGE engine
; Properly handles HDR -> LDR conversion
ivMode=1
ivDesaturation=0.25
ivGamma=1.1
ivVignetteIntensity=0.4
ivVignetteRadius=0.6
ivVignetteContrast=2.5
ivBloomIntensity=0.12
ivExposure=1.2

; ===== PS2 Color Correction (PC gamma 2.2) =====
; All PS2 values are pre-corrected for PC gamma space
; Uses Crytek BRDF correction factor (0.34 = 0.68 gamma * 0.5 mod2x)
ps2ModulateBuilding=0
ps2ModulateVehicle=0
ps2ModulateGrass=0
dualPassBuilding=1
dualPassVehicle=1
dualPassGrass=1
dualPassDefault=1
dualPassPed=1

; ===== Vegetation =====
grassAddAmbient=1
grassBackfaceCull=1
grassFixPlacement=1

; ===== Vehicle Rendering =====
; GTA IV-style dual specular + Fresnel reflection
envMapSize=512
envMapUseLODs=1
envMapFarClipMult=1.5
neoShininessMult=1.2
neoSpecularityMult=1.0
envShininessMult=1.5
envSpecularityMult=1.2
envPower=32.0
envFresnel=0.97

; ===== Building Rendering =====
detailMaps=1
stochasticTexturing=1

; ===== Shadows =====
pedShadows=1
stencilShadows=1

; ===== Modern Enhancements =====

; --- SMAA Anti-Aliasing ---
smaaEnable=1
smaaPreset=3
smaaPredication=0
smaaTemporal=0

; --- SSAO ---
ssaoEnable=1
ssaoRadius=1.0
ssaoPower=2.0
ssaoKernelSize=16
ssaoSampleCount=16

; --- Motion Blur (disabled by default) ---
motionBlurEnable=0
motionBlurStrength=0.4
motionBlurRadial=0.2
motionBlurSpeedFactor=0.3
motionBlurCameraAware=1

; --- SSS Post-Process (disabled by default) ---
sssPostProcessEnable=0
sssPostProcessStrength=0.2
sssPostProcessRadius=3.0
sssPostProcessThreshold=0.15

; --- Skin Enhancement (disabled by default) ---
skinEnhanceEnable=0
skinWrapFactor=0.4
skinSpecularPower=24.0
skinSpecularStrength=0.2
skinSSSStrength=0.3

; --- Hair Enhancement (disabled by default) ---
hairEnhanceEnable=0
hairAnisotropicPower=48.0
hairAnisotropicStrength=0.4
hairSSSStrength=0.15

; --- Vegetation Enhancement (disabled by default) ---
vegetationEnhanceEnable=0
vegetationSSSStrength=0.2
vegetationAmbientBoost=1.3

; --- Edge Tessellation (disabled by default) ---
edgeTessEnable=0
edgeTessStrength=0.005
edgeTessThreshold=0.15

; ===== Color Correction =====
; Preserves SA color palette while applying GTA IV look
rgb1Mult=0.85
rgb2Mult=0.90

; ===== YCbCr Correction =====
YCbCrCorrection=0

; ===== Misc =====
lightningIlluminatesWorld=1
coronaZtest=1
sunGlare=1
neoWaterDrops=1
neoBloodDrops=0
