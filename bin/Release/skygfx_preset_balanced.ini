[SkyGfx]
; ============================================================
; SkyGFX Plus - Balanced Modern Preset
; ============================================================
; Features: Best of all worlds, good performance
; ============================================================

presetMode=1
presetName=Balanced_Modern

; ===== Core Pipeline =====
buildingPipe=PC
vehiclePipe=Neo
colorFilter=VCS
radiosity=Shader
doRadiosity=1

; ===== GTA IV Tonemapping (subtle) =====
ivMode=0
ivDesaturation=0.20
ivGamma=1.0
ivVignetteIntensity=0.3
ivVignetteRadius=0.6
ivVignetteContrast=2.0
ivBloomIntensity=0.10
ivExposure=1.0

; ===== PS2 Color Correction =====
ps2ModulateBuilding=0
ps2ModulateVehicle=0
ps2ModulateGrass=0
dualPassBuilding=1
dualPassVehicle=1
dualPassGrass=1
dualPassDefault=1
dualPassPed=1

; ===== Vehicle Rendering =====
envMapSize=256
envMapUseLODs=1
envMapFarClipMult=1.0
neoShininessMult=1.0
neoSpecularityMult=1.0
envShininessMult=1.0
envSpecularityMult=1.0
envPower=20.0
envFresnel=0.7

; ===== Vegetation =====
grassAddAmbient=1
grassBackfaceCull=1
grassFixPlacement=1
detailMaps=1
stochasticTexturing=1

; ===== Shadows =====
pedShadows=1
stencilShadows=1

; ===== Modern Enhancements (performance-friendly) =====
smaaEnable=1
smaaPreset=2
smaaPredication=0
smaaTemporal=0

ssaoEnable=1
ssaoRadius=0.8
ssaoPower=1.5
ssaoKernelSize=8
ssaoSampleCount=8

motionBlurEnable=0
sssPostProcessEnable=0
skinEnhanceEnable=0
hairEnhanceEnable=0
vegetationEnhanceEnable=0
edgeTessEnable=0

; ===== Color Correction =====
rgb1Mult=0.95
rgb2Mult=0.95

; ===== Misc =====
lightningIlluminatesWorld=1
coronaZtest=1
sunGlare=1
neoWaterDrops=1
neoBloodDrops=0
YCbCrCorrection=0
