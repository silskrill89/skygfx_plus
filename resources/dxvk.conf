# DXVK config for GTA San Andreas + skygfx_plus_expIV
# Place this file next to d3d9.dll / vulkan.dll in the game root
# (NOT in an ASI loader plugins folder — DXVK must be in the game exe directory)

# Front-buffer effects (trails, motion blur, radiosity) require the extra front buffer.
# Without this, skygfx post-FX that reads/writes the front buffer will produce
# black output or crash.
d3d9.extraFrontbuffer = True

# Strict NaN/zero-emulation for SM3.0 PBR shaders with heavy division.
# skygfx PBR shaders use GGX/Smith with Schlick Fresnel — unprotected normalize()
# and D_GGX denominator can produce NaN. Strict mode squashes them to 0.
d3d9.floatEmulation = Strict

# Let the game control vsync; keep frame latency low to avoid input lag buildup.
d3d9.presentInterval = -1
d3d9.maxFrameLatency = 1

# Keep DF16/DF24 and D32 depth formats available.
# skygfx SSAO uses INTZ (emulated via DF24/D32) and depth-copy paths.
d3d9.supportDFFormats = True
d3d9.supportD32 = True
d3d9.useD32forD24 = False

# Do NOT enable deviceLossOnFocusLoss — breaks SA window refocus (dxvk#5106).
# The game handles alt-tab via its own window proc; DXVK's focus-loss device
# destruction causes a crash when the game tries to restore the device.
d3d9.deviceLossOnFocusLoss = False