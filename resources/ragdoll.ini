; ============================================================
; ragdoll.ini — Death ragdoll physics configuration
; Loaded by skygfx.asi at game start (Ragdoll_Init)
; Sections define per-joint constraint limits and per-body masses
; Missing sections/keys use sensible defaults (documented below)
; ============================================================

[BODY_PELVIS]
; Mass for the pelvis (root of skeleton)
mass=2.0

[BODY_SPINE]
; Mass for the spine/torso (capsule covering SPINE + SPINE1 bones)
mass=1.5

[BODY_HEAD]
; Mass for the head
mass=1.0

[BODY_L_UPPER_LEG]
; Left thigh mass
mass=1.0

[BODY_L_LOWER_LEG]
; Left calf mass
mass=0.8

[BODY_R_UPPER_LEG]
; Right thigh mass
mass=1.0

[BODY_R_LOWER_LEG]
; Right calf mass
mass=0.8

[BODY_L_UPPER_ARM]
; Left upper arm mass
mass=1.0

[BODY_L_LOWER_ARM]
; Left forearm mass
mass=0.8

[BODY_R_UPPER_ARM]
; Right upper arm mass
mass=1.0

[BODY_R_LOWER_ARM]
; Right forearm mass
mass=0.8

; ============================================================
; Joint Sections
; type = hinge | coneTwist
; A hinge joint has: lowLimit, highLimit (degrees)
; A coneTwist joint has: swingSpan1, swingSpan2, twistSpan (degrees)
; ============================================================

[JOINT_PELVIS_SPINE]
type=coneTwist
swingSpan1=5.0
swingSpan2=5.0
twistSpan=5.0

[JOINT_SPINE_HEAD]
type=coneTwist
swingSpan1=10.0
swingSpan2=10.0
twistSpan=10.0

[JOINT_L_HIP]
type=coneTwist
swingSpan1=45.0
swingSpan2=45.0
twistSpan=30.0

[JOINT_L_KNEE]
type=hinge
lowLimit=0.0
highLimit=130.0

[JOINT_R_HIP]
type=coneTwist
swingSpan1=45.0
swingSpan2=45.0
twistSpan=30.0

[JOINT_R_KNEE]
type=hinge
lowLimit=0.0
highLimit=130.0

[JOINT_L_SHOULDER]
type=coneTwist
swingSpan1=90.0
swingSpan2=45.0
twistSpan=45.0

[JOINT_L_ELBOW]
type=hinge
lowLimit=0.0
highLimit=150.0

[JOINT_R_SHOULDER]
type=coneTwist
swingSpan1=90.0
swingSpan2=45.0
twistSpan=45.0

[JOINT_R_ELBOW]
type=hinge
lowLimit=0.0
highLimit=150.0

; ============================================================
; Hit Reaction Section
; Controls how the ragdoll reacts to the hit that killed the ped
; impulseScale: base impulse multiplier (default 8.0)
; upBias: upward component added to impulse direction for dramatic fold (default 0.35)
; angScale: torque/rotation impulse scale (default 0.5)
; spineFraction: fraction of impulse passed to spine body for whole-body pivot (default 0.3)
; ============================================================

[HITREACTION]
impulseScale=8.0
upBias=0.35
angScale=0.5
spineFraction=0.3

; ============================================================
; Dismemberment Section
; Controls limb severing on peds who die from explosives/heavy weapons
; enable: 0=disable dismemberment, 1=enable (default 1)
; gibLifetime: seconds gibs persist (default 45.0)
; bloodSpurtInterval: seconds between blood spurts from stump (default 0.2)
; impulseScale: force applied to detached gib along damage direction (default 8.0)
; ============================================================

[DISMEMBER]
enable=1
gibLifetime=45.0
bloodSpurtInterval=0.2
impulseScale=8.0